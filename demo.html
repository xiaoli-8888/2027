    --border: #E8E8E8;

    --brand-soft: #F0F0F0;
    --accent: #E63946;
    --radius: 14px;
    --radius-sm: 8px;
    --radius-full: 999px;
    --font: "PingFang SC", "Helvetica Neue", "Inter", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.01em;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ===== Page Transitions ===== */
  .page { display: none; min-height: 100%; animation: fadeIn .4s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ===== Page 1: Select Companions ===== */
  .select-page { padding: 32px 40px 120px; overflow: visible; }
  .brand-title {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 8px; text-align: left;
  }
  .brand-title em { font-style: italic; font-weight: 400; }
  .brand-sub {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 24px; text-align: left;
    letter-spacing: 0.02em;
  }
  .section-label {
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .companions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 32px;
  }
  .companion-card {
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: transform .25s ease;
    padding: 0;
    position: relative;
  }
  .companion-card:hover { transform: translateY(-4px); }
  .companion-card.selected .avatar-wrap {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }
  .companion-card.selected .avatar-wrap::after {
    content: "";
    position: absolute;
    bottom: -6px; right: -6px;
    width: 22px; height: 22px;
    background: var(--text);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .companion-card.selected .avatar-wrap::before {
    content: "✓";
    position: absolute;
    bottom: -4px; right: -3px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    z-index: 2;
  }
  .avatar-wrap {
    position: relative;
    width: 140px; height: 140px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 14px;
    background: var(--bg-elev);
    transition: outline .2s ease;
    border: 1px solid var(--border);
  }
  .companion-name {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .companion-name em { font-style: italic; font-weight: 400; color: var(--text-muted); font-size: 13px; }
  .companion-role {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  /* ===== Artist Avatars (flat SVG illustrations) ===== */
  .avatar-wrap svg { width: 100%; height: 100%; display: block; }

  /* ===== Sticky Footer ===== */
  .footer-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 20px 40px;
    background: rgba(250,250,250,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }
  .selected-count {
    font-size: 13px;
    color: var(--text-muted);
  }
  .selected-count b { color: var(--text); font-weight: 500; }
  .btn-primary {
    padding: 14px 32px;
    background: var(--text);
    color: #fff;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: opacity .2s;
  }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { opacity: 0.85; }

  /* ===== Page 2: Shopping Page ===== */
  .shop-page { padding: 0 24px 160px; }
  .shop-header {
    padding: 20px 0;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }
  .back-btn:hover { color: var(--text); }
  .progress {
    flex: 1;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--text);
    width: 0%;
    transition: width .5s ease;
  }
  .progress-num {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* Product Card */
  .product {
    margin-top: 16px;
    animation: fadeIn .5s ease;
  }
  .product-img {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--bg-elev);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .product-img svg { width: 70%; height: 90%; }

  .product-meta {
    margin-top: 20px;
  }
  .product-brand {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .product-name {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .product-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .product-price {
    font-size: 18px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;

  }
  .btn-ghost:hover { border-color: var(--text); }
  .btn-ghost.active { background: var(--text); color: #fff; border-color: var(--text); }

    from { opacity: 0; transform: translateY(12px) scale(.9); }

  }

  /* ===== 开场 Splash 搭子入场仪式 ===== */
  /* ============ 撕开胶带开场 ============ */
  .splash {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: opacity 0.4s ease;
  }
  .splash.torn { opacity: 0; pointer-events: none; }

  /* 标题和副标题 —— 胶带撕开后才出现 */
  .splash-title {
    position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
    font-size: 52px; font-weight: 300; letter-spacing: -0.02em;
    opacity: 0; transition: opacity 0.8s ease 0.1s;
  }
  .splash.torn .splash-title { opacity: 1; }
  .splash-title em { font-style: italic; font-weight: 400; }
  .splash-sub {
    position: absolute; top: 40%; left: 50%; transform: translateX(-50%);
    font-size: 15px; color: var(--text-muted); letter-spacing: 0.05em;
    opacity: 0; transition: opacity 0.8s ease 0.3s;
  }
  .splash.torn .splash-sub { opacity: 1; }

  /* 头像 —— 胶带撕开后从下方浮现 */
  .splash-avatars {
    position: absolute; top: 55%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex; gap: 24px;
    opacity: 0; transition: opacity 0.6s ease 0.5s, transform 0.8s cubic-bezier(.2,.8,.2,1) 0.5s;
  }
  .splash.torn .splash-avatars { opacity: 1; transform: translate(-50%, -50%) translateY(-10px); }
  .splash-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    background: #eee; overflow: hidden;
    transform-origin: center center;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .splash.torn .splash-avatar { animation: avatarPop 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
  .splash.torn .splash-avatar:nth-child(1) { animation-delay: 0.55s; }
  .splash.torn .splash-avatar:nth-child(2) { animation-delay: 0.65s; }
  .splash.torn .splash-avatar:nth-child(3) { animation-delay: 0.75s; }
  .splash.torn .splash-avatar:nth-child(4) { animation-delay: 0.85s; }
  .splash.torn .splash-avatar:nth-child(5) { animation-delay: 0.95s; }
  @keyframes avatarPop {
    from { opacity: 0; transform: scale(0.5) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }

  .splash-avatar img, .splash-avatar svg { width: 100%; height: 100%; object-fit: cover; }

  /* ============ 拼贴开箱开场 ============ */
  .tape-wrap {
    position: absolute; top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    height: 320px;
    cursor: grab;
    user-select: none;
    z-index: 5;
  }
  .tape-wrap:active { cursor: grabbing; }
  .collage-svg {
    width: 100%; height: 100%;
    display: block;
  }
  /* 胶带飞出动画 */
  .collage-svg .tape-piece {
    transform-origin: center center;
  }
  .tape-wrap.tearing .collage-svg .tape-piece {
    animation: tapeFly 0.65s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .tape-wrap.tearing .collage-svg .tape-piece.tp-1 { animation-delay: 0s; }
  .tape-wrap.tearing .collage-svg .tape-piece.tp-2 { animation-delay: 0.05s; }
  .tape-wrap.tearing .collage-svg .tape-piece.tp-3 { animation-delay: 0.1s; }
  .tape-wrap.tearing .collage-svg .tape-piece.tp-4 { animation-delay: 0.15s; }

  @keyframes tapeFly {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
    30%  { transform: translate(var(--fx,0), var(--fy,8px)) rotate(var(--fr,-12deg)) scale(0.85); opacity: 1; }
    100% { transform: translate(calc(var(--fx,0)*2.5), calc(var(--fy,8px)*4)) rotate(calc(var(--fr,-12deg)*2)) scale(0.5); opacity: 0; }
  }
  /* 底下的拼贴内容延迟淡出 */
  .collage-svg .under-layer {
    opacity: 0;
    transition: opacity 0.5s ease 0.3s;
  }
  .tape-wrap.tearing .collage-svg .under-layer { opacity: 1; }

  .tape-wrap.tearing {
    transition: opacity 0.15s ease 0.7s;
    opacity: 0;
  }

  /* 提示文字 */
  .tape-hint {

  }

    85% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -104%) scale(0.95); }
  }

  /* splash 结束后显示主页面 */
  .page { opacity: 1; transition: opacity 0.6s ease; }

const avatarDebounce = {}; // 每人1秒内只触发一次
function checkAvatarProximity(mouseX, mouseY) {
  document.querySelectorAll(".companion-card").forEach(card => {
    const id = card.dataset.id;
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(mouseX - cx, mouseY - cy);
    if (dist < 100 && !avatarDebounce[id]) {
      avatarDebounce[id] = true;
      showBubble(cx, rect.top - 8, id);
      setTimeout(() => avatarDebounce[id] = false, 1800);
    }
  });
}
function showBubble(x, y, personId) {
  const lines = BUBBLE_LINES[personId] || ["嘿,看看这里"];
  const text = lines[Math.floor(Math.random() * lines.length)];
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  b.style.left = x + "px";
  b.style.top = y + "px";
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 3200);
}
document.addEventListener("mousemove", (e) => {
  if (!document.body.classList.contains("splash-done")) return;

/* ============ 渲染选陪伴者页面 ============ */
function renderSelectPage() {
  selectedIds.clear();
  updateFooter();
  var row1 = document.getElementById("trackRow1");
  var row2 = document.getElementById("trackRow2");
  if (!row1 || !row2) { console.error("trackRow1/2 not found!"); return; }
  row1.innerHTML = "";
  row2.innerHTML = "";
  var row1Data = COMPANIONS.slice(0, 6);
  var row2Data = COMPANIONS.slice(6);
  row1Data = row1Data.concat(row1Data);
  row2Data = row2Data.concat(row2Data);
  console.log("COMPANIONS count:", COMPANIONS.length, "row1:", row1Data.length, "row2:", row2Data.length);
  row1Data.forEach(function(c) { row1.appendChild(makeCard(c)); });
  row2Data.forEach(function(c) { row2.appendChild(makeCard(c)); });
  console.log("row1 children:", row1.children.length, "row2 children:", row2.children.length);
  document.querySelectorAll(".scroller-card").forEach(function(card) {
    card.addEventListener("click", function() {
      var id = card.dataset.id;
      if (selectedIds.has(id)) selectedIds.delete(id);
      else if (selectedIds.size < 5) selectedIds.add(id);
      card.classList.toggle("selected", selectedIds.has(id));
      updateFooter();
    });
    card.addEventListener("mouseenter", function() { showScrollerBubble(card); });
    card.addEventListener("mouseleave", function() { hideScrollerBubble(card); });
  });
}

function makeCard(c) {
  var div = document.createElement("div");
  div.className = "scroller-card";
  div.dataset.id = c.id; div.dataset.name = c.name;
  div.innerHTML =
    '<img src="' + c.img + '" onerror="this.style.display=\'none\';var d=document.createElement(\'div\');d.style.cssText=\'width:180px;height:180px;background:#f5f5f5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:14px;\';d.textContent=\'无图\';this.parentElement.appendChild(d);">' +
    '<div class="scroller-name"><span class="dot ' + (c.online ? "on" : "off") + '"></span>' + c.name + '</div>' +
    '<div class="scroller-role">' + c.role + '</div>' +
    '<div class="scroller-check">✓</div>';
  return div;
}

function showScrollerBubble(card) {
  var bubble = document.createElement("div");
  bubble.className = "scroller-bubble";
  var name = card.dataset.name || card.querySelector(".scroller-name").textContent.trim();
  bubble.textContent = (ADVISOR_LINES[name] && ADVISOR_LINES[name]["default"]) || "这件不错, 可以试试!";
  card.appendChild(bubble);
}

function hideScrollerBubble(card) {
  var b = card.querySelector(".scroller-bubble");
  if (b) b.remove();
}
function toggleCompanion(c, card) {
  if (selectedIds.has(c.id)) {
    selectedIds.delete(c.id);
    card.classList.remove("selected");
  } else {
    selectedIds.add(c.id);
    card.classList.add("selected");
  }
  updateFooter();
}

function updateFooter() {
  const count = selectedIds.size;
  var el = document.getElementById("countNum");
  if (el) el.textContent = count;
  var btn = document.getElementById("startBtn");
  if (btn) { btn.disabled = count === 0; btn.classList.toggle("enabled", count > 0); }
}

document.getElementById("startBtn").addEventListener("click", () => {
  if (selectedIds.size === 0) return;
  document.getElementById("page-select").classList.remove("active");

  initShopPage();
});

function initShopPage() {
  renderShopTabs();
  renderShopSidebar();
  renderMasonry();
  document.getElementById("backBtn").onclick = function() { document.getElementById("page-shop").classList.remove("active"); document.getElementById("page-select").classList.add("active"); };
  document.getElementById("detailClose").onclick = closeDetail;
  document.getElementById("detailOverlay").onclick = function(e) { if (e.target.id === "detailOverlay") closeDetail(); };
  document.getElementById("chatDialogSend").onclick = sendChat;
  document.getElementById("chatDialogInput").addEventListener("keydown", function(e) { if (e.key === "Enter") sendChat(); });
  document.addEventListener("keydown", function(e) { if (e.key === "Escape") { closeDetail(); closeChatDialog(); } });
}

function renderShopTabs() {
  var tabs = document.getElementById("shopTabs");
  tabs.innerHTML = "";
  CLOTHING_TABS.forEach(function(tab) {
    var btn = document.createElement("button");
    btn.className = "shop-tab" + (tab === _currentTab ? " active" : "");
    btn.textContent = tab;
    btn.onclick = function() { _currentTab = tab; renderShopTabs(); renderMasonry(); };
    tabs.appendChild(btn);
  });
}

function renderShopSidebar() {
  var sb = document.getElementById("shopSidebar");
  sb.innerHTML = "";
  COMPANIONS.filter(function(c) { return selectedIds.has(c.id); }).forEach(function(c) {
    var wrap = document.createElement("div");
    wrap.className = "mini-avatar-wrap";
    wrap.dataset.name = c.name;
    wrap.innerHTML = 
      '<img class="mini-avatar" src="' + c.img + '" onerror="this.style.display=\'none\';this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23DC236E%22 width=%22100%22 height=%22100%22/></svg>\'">' +
      '<div class="mini-name"><span class="mini-online ' + (c.online ? "on" : "off") + '"></span>' + c.name + '</div>';
    wrap.onclick = function() {
      if (!window._detailOpen) return;
      setActiveAdvisor(wrap, c.name);
      openChatDialog(c.name);
    };
    sb.appendChild(wrap);
  });
}

function setActiveAdvisor(wrap, name) {
  var avatars = document.querySelectorAll("#shopSidebar .mini-avatar");
  avatars.forEach(function(a) { a.classList.remove("active"); });
  var target = wrap.querySelector(".mini-avatar");
  if (target) target.classList.add("active");
}

      '<div class="cc-img-placeholder" style="background:' + (item.color || '#eee') + '">' + item.name + '</div>';

    // emoji 璐寸焊锛? 涓紝hover 鏄剧ず璇勮
    var emo = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

function showFirstAdvisorTip(text, duration) {
      var sidebar = document.getElementById("shopSidebar");
      if (!sidebar) return;
      var firstAvatar = sidebar.querySelector(".mini-avatar-wrap");
      if (!firstAvatar) return;
      document.querySelectorAll(".advisor-bubble.tip").forEach(function(b) { b.remove(); });
      var rect = firstAvatar.getBoundingClientRect();
      var bubble = document.createElement("div");
      bubble.className = "advisor-bubble tip";
      bubble.textContent = text;
      bubble.style.left = (rect.right + 12) + "px";
      bubble.style.top = (rect.top + rect.height / 2 - 15) + "px";
      document.body.appendChild(bubble);
      setTimeout(function() { if (bubble.parentNode) bubble.parentNode.removeChild(bubble); }, duration || 4000);
    }function closeDetail() {
  document.getElementById("detailOverlay").style.display = "none";
  window._detailOpen = false;
  closeChatDialog();
}

function openChatDialog(name) {
  _currentChatAdvisor = name;
  var dlg = document.getElementById("chatDialog");
  dlg.style.display = "flex";
  dlg.querySelector("#chatDialogTitle").innerHTML = '跟 <span style="color:#DC236E">' + name + '</span> 聊一聊';
  dlg.querySelector("#chatDialogInput").value = "";
  setTimeout(function() { dlg.querySelector("#chatDialogInput").focus(); }, 100);
}

function closeChatDialog() {
  document.getElementById("chatDialog").style.display = "none";
  _currentChatAdvisor = null;
  document.querySelectorAll(".advisor-bubble").forEach(function(b) { b.remove(); });
}

function sendChat() {
  var input = document.getElementById("chatDialogInput");
  var text = input.value.trim();
  if (!text || !_currentChatAdvisor) return;
  input.value = "";
  var reply = generateAdvisorReply(_currentChatAdvisor, text);
  showAdvisorBubble(_currentChatAdvisor, reply);
}

function generateAdvisorReply(name, userText) {
  var tab = _currentTab;
  var lines = ADVISOR_LINES[name];
  var base = (lines && lines[tab]) || (lines && lines["default"]) || "这件不错, 可以试试!";
  var kw = "";
  if (/好看|漂亮|美|赞/.test(userText)) kw = " 我也觉得, 这种风格很适合你!";
  else if (/搭配|怎么穿|配什么/.test(userText)) kw = " 建议搭高腰裤, 露出最细的脚踝。";
  else if (/价格|贵|便宜|钱/.test(userText)) kw = " 等打折吧, 这个季节末会有活动。";
  else if (/颜色|色系/.test(userText)) kw = " 再加一只金色耳饰就完美了。";
  else if (/风格|潮流|流行/.test(userText)) kw = " 千禧回潮正当时, 快入手!";
  return base + kw;
}

function showAdvisorBubble(name, text) {
  var sidebar = document.getElementById("shopSidebar");
  if (!sidebar) return;
  var wraps = sidebar.querySelectorAll(".mini-avatar-wrap");
  var target = null;
  wraps.forEach(function(w) { if (w.dataset.name === name) target = w; });
  if (!target) return;
  var rect = target.getBoundingClientRect();
  var bubble = document.createElement("div");
  bubble.className = "advisor-bubble";
  document.body.appendChild(bubble);
  bubble.style.left = (rect.right + 12) + "px";
  bubble.style.top = (rect.top + rect.height / 2 - 15) + "px";
  var i = 0;
  bubble.textContent = "";
  var typing = setInterval(function() {
    if (i < text.length) { bubble.textContent += text[i]; i++; }
    else {
      clearInterval(typing);
      setTimeout(function() { if (bubble.parentNode) bubble.parentNode.removeChild(bubble); }, 5000);
    }
  }, 40);
}

function postComment(btn) {
  var input = btn.previousElementSibling;
  if (!input.value.trim()) return;
  var c = document.createElement("div");
  c.className = "detail-comment";
  c.innerHTML = "<b>我</b>：" + input.value;
  btn.parentNode.insertBefore(c, input);
  input.value = "";
}
